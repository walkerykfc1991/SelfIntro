# Blueprint: deploy Cha Kee (food-order) on Render Free
# Docs: https://render.com/docs/blueprint-spec
# After push: https://dashboard.render.com/select-repo?type=blueprint

services:
  - type: web
    name: cha-kee
    runtime: node
    plan: free
    region: singapore
    rootDir: food-order
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cha-kee-db
          property: connectionString

databases:
  - name: cha-kee-db
    plan: free
    region: singapore
    databaseName: chakee
    # Free Postgres expires after 30 days — recreate or upgrade for longer demos.
